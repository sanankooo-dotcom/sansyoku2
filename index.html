<!-- 
  ========================================================================
  Vercel Webサイト埋め込み用コード (HTML / プレーンサイト用)
  ========================================================================
  使い方:
  1. 下記の「YOUR_GAS_WEB_APP_URL_HERE」をご自身のGASウェブアプリURLに置き換えます。
  2. VercelでホストしているHTMLファイル（index.html等）にそのまま貼り付けます。
  3. スマホでも画面いっぱいに快適に操作できるよう最適化されています。
-->

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ゲーム会社 倉庫管理システム</title>
  <link rel="icon" href="logo.jpg" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #070b14;
    }
    /* iframe をスマホ・PC両対応で全画面表示 */
    .gas-iframe-container {
      width: 100%;
      height: 100dvh; /* スマホのアドレスバー伸縮に対応 */
      height: 100vh;  /* フォールバック */
      position: relative;
    }
    .gas-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <div class="gas-iframe-container">
    <iframe 
      class="gas-iframe"
      src="https://script.google.com/macros/s/AKfycbzqtlXafNPIQUe6GkyQZHssYDFaw7kCnM3MFkf71yqhOj397DYGzDrZqGTqWM4xxp0xkw/exec"
      title="会社倉庫 納品＆給与管理システム"
      allow="clipboard-write"
      loading="lazy">
    </iframe>
  </div>

</body>
</html>
